[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

solc = "0.8.26"
evm_version = "cancun"          # Uniswap v4 needs transient storage; Robinhood Chain runs ArbOS 61
optimizer = true
optimizer_runs = 200
via_ir = false                  # kept off for fast iteration; the `deploy` profile turns it on
bytecode_hash = "none"

# Fork tests pin a block, so results stay reproducible over time; the `robinhood` alias is
# resolved from [rpc_endpoints] below. No filesystem access is granted: fixtures are
# expressed as constants in test/base/Fixtures.sol, not read from disk.

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

# Fast lane: unit tests only, no network. Used by CI on every push.
[profile.lite]
optimizer = false
via_ir = false

[profile.lite.fuzz]
runs = 64

# Deep lane: PRs to main + the nightly schedule.
[profile.deep.fuzz]
runs = 4096

[profile.deep.invariant]
runs = 1024
depth = 128
fail_on_revert = false

# Production build: via-IR, matching how Uniswap ships v4 periphery.
#
# `optimizer_runs` is 200, not the 1,000,000 Uniswap uses, because runs buy execution gas
# with code size and FarmentaMarket has no size to spend. Measured 2026-09-12 at the head of
# PR #8 (custody + mintAndDeposit, via-IR): 1,000,000 runs -> 23,963 bytes, 613 under
# EIP-170; 10,000 -> 20,527; 1,000 -> 18,662; 200 -> 16,073. The debt ledger (FAR-6),
# liquidate (FAR-10) and five modifyLiquidities paths still have to fit in the same contract,
# and at 0.02 gwei the execution gas the higher setting saves is not worth measuring. This
# is a stopgap; the room comes back for real when the arithmetic moves to external libraries
# (FAR-26). The CI fast lane gates size on this profile, since it is the one that ships.
[profile.deploy]
via_ir = true
optimizer_runs = 200

[lint]
# Off during builds. The linter in Foundry `stable` panics on this codebase —
# "native_members: type Struct(StructId) should be wrapped in Ref", an upstream crash in
# solar — which aborts `forge build` with a core dump and takes CI down with it. Lints are
# advisory; the compiler, the tests and `forge fmt --check` are the actual gates. Run
# `forge lint` by hand on a toolchain where it works.
lint_on_build = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
multiline_func_header = "params_first"
sort_imports = true

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
